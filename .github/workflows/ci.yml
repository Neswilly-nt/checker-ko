name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API tests
        working-directory: backend
        run: python -m pytest -q
      - name: Validate production schema migrations
        working-directory: backend
        env:
          APP_ENV: test
          CHECKER_SECRET: ci-test-only-secret-with-at-least-32-characters
          CHECKER_DATA_DIR: ${{ runner.temp }}/checker-ko-ci-data
          DATABASE_URL: sqlite:///${{ runner.temp }}/checker-ko-ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check TypeScript
        working-directory: frontend
        run: npm run check
      - name: Check translations
        working-directory: frontend
        run: npm run i18n:check
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build
