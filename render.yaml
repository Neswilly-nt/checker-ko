services:
  - type: web
    name: checker-ko-demo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: develop
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CHECKER_DATA_DIR
        value: /tmp/checker-ko
      - key: CHECKER_STORAGE_BACKEND
        value: supabase
      - key: CHECKER_DEMO_MODE
        value: "true"
      - key: CHECKER_SUPABASE_STORAGE_BUCKET
        value: checker-private
      - key: CHECKER_COOKIE_SAMESITE
        value: lax
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: CHECKER_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHECKER_CORS_ORIGINS
        sync: false
      - key: CHECKER_SUPABASE_URL
        sync: false
      - key: CHECKER_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VIDEO_MAX_MB
        value: "15"
      - key: VIDEO_MAX_SECONDS
        value: "15"

  - type: web
    name: checker-ko-demo-web
    runtime: static
    branch: develop
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: 'off'
    envVars:
      - key: VITE_CHECKER_API_URL
        value: /api
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
    routes:
      - type: rewrite
        source: /api/*
        destination: https://checker-ko-demo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
